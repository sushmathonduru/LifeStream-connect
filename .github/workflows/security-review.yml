name: Enterprise Security Assessment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security-audits:
    name: Backend Security Scans (SAST, SCA, Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. NPM Audit (SCA / Dependency Scanning)
        run: |
          npm install
          npm audit --json > dependency-report.json || true
          
      - name: 2. Semgrep SAST Scanning
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/default"
          generateSarif: "1"
          
      - name: 3. Trivy FS Scanner (Vulnerabilities & Misconfigurations)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Don't fail the build immediately
          ignore-unfixed: true
          vuln-type: 'os,library'
          
      - name: 4. Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 5. Generate Test Cases & Reports
        run: |
          cd scripts
          npm install
          node generate_security_reports.js
          
      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security-Review-Reports
          path: |
            Vulnerability Test Results/
            dependency-report.json
          retention-days: 30

      - name: Publish Security Summary
        run: |
          echo "### 🛡️ Enterprise Security Assessment Complete" >> $GITHUB_STEP_SUMMARY
          echo "1. **Semgrep**: Source Code Analysis completed." >> $GITHUB_STEP_SUMMARY
          echo "2. **Trivy**: Dependency & OS layer scanning completed." >> $GITHUB_STEP_SUMMARY
          echo "3. **Gitleaks**: Secrets scanning completed." >> $GITHUB_STEP_SUMMARY
          echo "4. **Test Cases**: Generated 400+ API & Backend security test cases." >> $GITHUB_STEP_SUMMARY
          echo "Please download the \`Security-Review-Reports\` artifact to view the detailed Excel and Markdown findings." >> $GITHUB_STEP_SUMMARY
